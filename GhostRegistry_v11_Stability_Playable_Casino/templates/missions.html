<!DOCTYPE html><html><head><title>Missions</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="top-bar"><div><b>👻 {{ user.username }}</b> | {{ user.role }}</div><div>{{ credit_name }}: <b>{{ user.credits }}</b></div></div><div class="page"><h1>Daily Missions</h1>{% if message %}<p class="message">{{ message }}</p>{% endif %}<div class="shop-grid">{% for m in missions %}<div class="panel shop-card"><h2>{% if m.done %}✅{% else %}⬜{% endif %} {{ m.name }}</h2><p>{{ m.goal }}</p><p><b>Reward:</b> {{ m.reward }}</p>{% if m.done %}<form method="POST"><input type="hidden" name="mission_name" value="{{ m.name }}"><input type="hidden" name="reward" value="{{ m.reward.split(' ')[0] if m.reward.split(' ')[0].isdigit() else 0 }}"><button>Claim Reward</button></form>{% endif %}</div>{% endfor %}</div><a href="/dashboard"><button>Back</button></a></div><script src="/static/matrix.js"></script></body></html>

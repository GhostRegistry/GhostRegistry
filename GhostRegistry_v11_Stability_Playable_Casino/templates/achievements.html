<!DOCTYPE html><html><head><title>Achievements</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="top-bar"><div><b>👻 {{ user.username }}</b></div><div>{{ credit_name }}: <b>{{ user.credits }}</b></div></div><div class="page"><h1>Achievements</h1><div class="shop-grid">{% for a in achievements %}<div class="panel shop-card"><h2>🏆 {{ a.title }}</h2><p>Code: {{ a.achievement_code }}</p><p>Reward: {{ a.reward }} {{ credit_name }}</p><small>{{ a.created_at }}</small></div>{% else %}<p>No achievements yet.</p>{% endfor %}</div><a href="/dashboard"><button>Back</button></a></div><script src="/static/matrix.js"></script></body></html>

<!DOCTYPE html><html><head><title>{{ title }}</title><link rel="stylesheet" href="/static/style.css"><style>.gamebox{max-width:900px;margin:auto;text-align:center}.play{border:1px solid #00ffee;border-radius:18px;background:rgba(0,16,30,.86);padding:20px;min-height:360px}.grid9{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}.cell{height:90px;border:1px solid #00ffee;border-radius:12px;font-size:42px;background:#001928;color:white}.mem{display:grid;grid-template-columns:repeat(4,80px);gap:8px;justify-content:center}.mem button{height:70px}.target{width:60px;height:60px;border-radius:50%;position:relative;background:#00ffee;color:#001;font-weight:900}.canvas{border:1px solid #00ffee;background:#001018}</style></head><body><div class="top-bar"><div>👻 {{ user.username }}</div><div><a href="/fun-games"><button>Fun Games Hub</button></a><a href="/dashboard"><button>Dashboard</button></a></div></div><div class="page gamebox"><h1>{{ title }}</h1><p>No Ghost Shards. Just for fun.</p><div id="play" class="play"></div><div id="msg" class="result">Loading...</div></div><script>
const game='{{ game }}', play=document.getElementById('play'), msg=document.getElementById('msg');function say(t){msg.textContent=t}
if(game==='tictactoe'){let b=Array(9).fill(''),turn='X';function render(){play.innerHTML='<div class="grid9">'+b.map((v,i)=>`<button class="cell" onclick="move(${i})">${v}</button>`).join('')+'</div>';say('You are X.')}window.move=i=>{if(b[i])return;b[i]='X';let win=check();if(win)return end(win);let empty=b.map((v,i)=>v?'':i).filter(v=>v!=='');if(empty.length){b[empty[Math.floor(Math.random()*empty.length)]]='O'}win=check();if(win)return end(win);render()};function check(){let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(let l of lines){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]]}return b.every(Boolean)?'Draw':null}function end(w){render();say(w==='X'?'You win!':w==='O'?'Computer wins.':'Draw.')}render()}
else if(game==='memory'){let vals=['👻','👻','💎','💎','🍜','🍜','👑','👑'].sort(()=>Math.random()-.5),open=[],done=[];function render(){play.innerHTML='<div class="mem">'+vals.map((v,i)=>`<button onclick="pick(${i})">${done.includes(i)||open.includes(i)?v:'?'}</button>`).join('')+'</div>';say('Match all pairs.')}window.pick=i=>{if(done.includes(i)||open.includes(i))return;open.push(i);if(open.length===2){if(vals[open[0]]===vals[open[1]])done.push(...open);setTimeout(()=>{open=[];render();if(done.length===vals.length)say('You cleared Memory Match!')},500)}render()};render()}
else if(game==='reaction'){play.innerHTML='<button id="rbtn">Wait...</button>';let btn=document.getElementById('rbtn'),start=0;setTimeout(()=>{btn.textContent='CLICK NOW';start=Date.now()},1000+Math.random()*3000);btn.onclick=()=>{if(!start)say('Too early!');else say('Reaction: '+(Date.now()-start)+' ms')}}
else if(game==='typing'){let phrase='ghost registry hacker noodles';play.innerHTML=`<h2>Type this:</h2><p>${phrase}</p><input id="inp" autofocus><button onclick="checkType()">Check</button>`;window.checkType=()=>{let v=document.getElementById('inp').value;say(v===phrase?'Perfect typing!':'Not quite. Accuracy '+Math.round([...v].filter((c,i)=>c===phrase[i]).length/phrase.length*100)+'%')}}
else if(game==='aim'){let score=0;function spawn(){play.innerHTML='<button class="target" style="left:'+Math.random()*700+'px;top:'+Math.random()*230+'px" onclick="score++;spawn()">👻</button>';say('Score: '+score)}spawn()}
else {play.innerHTML='<h2>🎮 Playable mini-game mode</h2><p>This room is ready as a no-credit fun game hub. More advanced controls can be expanded from here.</p><button onclick="say(\'Score: \'+Math.floor(Math.random()*9999))">Quick Play Round</button>';say('No Ghost Shards are used here.')}
</script><script src="/static/matrix.js"></script><script src="/static/live_check.js"></script></body></html>

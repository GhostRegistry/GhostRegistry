<!DOCTYPE html><html><head><title>User Directory</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="top-bar"><div><b>👻 {{ user.username }}</b></div><div>{{ credit_name }}: <b>{{ user.credits }}</b></div></div><div class="page"><h1>Public User Directory</h1><p>Shows usernames, roles, ranks, and social codes only.</p><input class="search" id="dirSearch" placeholder="Search users..." onkeyup="searchTable('dirSearch','dirTable')"><div class="table-wrap"><table id="dirTable"><tr><th>Username</th><th>Role</th><th>Rank</th><th>Social Code</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ u.rank or '' }}</td><td>{{ u.social_code }}</td></tr>{% endfor %}</table></div><a href="/dashboard"><button>Back</button></a></div><script>function searchTable(i,t){let q=document.getElementById(i).value.toLowerCase();document.querySelectorAll('#'+t+' tr').forEach((r,x)=>{if(x>0)r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}</script><script src="/static/matrix.js"></script></body></html>

<!DOCTYPE html><html><head><title>Notifications</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="top-bar"><div><b>👻 {{ user.username }}</b></div><div>{{ credit_name }}: <b>{{ user.credits }}</b></div></div><div class="page"><h1>Notification Center</h1><form method="POST"><button>Mark All Read</button></form><div class="panel">{% for n in items %}<div class="chat-message"><b>{% if not n.is_read %}🔔 {% endif %}{{ n.title }}</b><p>{{ n.message or n.text }}</p><small>{{ n.created_at or n.time }}</small></div>{% endfor %}</div><a href="/dashboard"><button>Back</button></a></div><script src="/static/matrix.js"></script></body></html>

<!DOCTYPE html><html><head><title>GhostNet</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="top-bar"><div><b>👻 {{ user.username }}</b> | {{ user.role }}</div><div>{{ credit_name }}: <b>{{ user.credits }}</b> | Rank: <b>{{ user.rank }}</b></div></div><div class="page compact-page"><h1>🌐 GhostNet</h1><p class="status-line">Social feed for posts, milestones, achievements, and announcements.</p><div class="panel"><h2>Feed</h2>{% for p in posts %}<div class="chat-message"><b>{{ p.by }}</b><p>{{ p.title }} — {{ p.details }}</p><small>👍 Like · 💬 Comment · Share</small></div>{% endfor %}</div><br><a href="/dashboard"><button>Back To Dashboard</button></a></div><script src="/static/matrix.js"></script><script src="/static/live_check.js"></script></body></html>
